<!-- ====== LIQUID RAYMARCHING BACKGROUND ====== -->
<!-- Compiled from app/static/js/raymarch-bg.src.js; three.js comes from the CDN below. -->
<style>
    #raymarch-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        display: block;
    }
</style>

<script type="importmap">
{
  "imports": {
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.webgpu.js"
  }
}
</script>
<script type="module">
    import mount from "{{ url_for('static', filename='js/raymarch-bg.js') }}";

    /* The canvas is created here rather than written as markup on purpose.
       The homepage river (index.html) fetches the other pages and clones their
       <body> children into itself, stripping only header/footer/script/style/
       link — so a literal <canvas> in this shared partial would be duplicated
       into the homepage once per fetched page, with repeated ids. A <script>
       is stripped, so building the element here keeps exactly one of them. */
    const canvas = document.createElement('canvas');
    canvas.id = 'raymarch-bg';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.prepend(canvas);

    mount(canvas);
</script>
<!-- ====== END BACKGROUND ====== -->
